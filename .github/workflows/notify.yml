name: Check AMD Gaming & Promotions

on:
  schedule:
    - cron: '*/5 * * * *'  # 5 minutes is the lowest possible on GitHub Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Upgrade to @v7 (targets Node 24 natively)
      - name: Checkout repository
        uses: actions/checkout@v7

      # Upgrade to @v7 (targets Node 24 natively)
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run watcher script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          AMDGAMING_COOKIE: ${{ secrets.AMDGAMING_COOKIE }}
        run: python amdgaming_watcher.py

      - name: Commit and push updated seen_ids
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_ids.txt
          git diff --staged --quiet || (git commit -m "chore: update seen_ids [skip ci]" && git push)
